<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rhodium45 Smart Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 20% 20%, rgba(90, 120, 255, 0.20), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(180, 80, 255, 0.16), transparent 30%),
        linear-gradient(135deg, #050816 0%, #0b1024 50%, #050816 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    header {
      position: relative;
      z-index: 10;
      padding: 24px 0;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      background: rgba(10, 15, 38, 0.65);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .mini-coin {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      color: #10131c;
      background: linear-gradient(145deg, #ffffff, #9ba5b8 45%, #e9edf5);
      border: 3px solid #687384;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.7),
        0 8px 25px rgba(255,255,255,.12);
    }

    .brand span {
      color: #9da9c9;
      font-size: 11px;
      display: block;
      margin-top: 2px;
    }

    .connect {
      border: 0;
      padding: 12px 18px;
      border-radius: 13px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #596cff, #8b55ff);
      box-shadow: 0 10px 30px rgba(100,90,255,.3);
      transition: .2s;
    }

    .connect:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(100,90,255,.45);
    }

    .hero {
      min-height: 620px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: 60px;
      padding: 70px 0 50px;
    }

    .eyebrow {
      display: inline-block;
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 100px;
      color: #aeb9dc;
      background: rgba(255,255,255,.045);
      font-size: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(46px, 7vw, 82px);
      line-height: .95;
      letter-spacing: -4px;
      margin-bottom: 24px;
    }

    h1 .gradient {
      background: linear-gradient(90deg, #ffffff, #9aa9ff, #d19aff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero-text {
      max-width: 620px;
      color: #a8b1ca;
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary,
    .secondary {
